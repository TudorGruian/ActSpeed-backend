# Development broker: anonymous access, published on localhost only by
# docker-compose. Do NOT use this configuration on a reachable network.
#
# For real devices, switch to per-device credentials and topic ACLs:
#
#   allow_anonymous false
#   password_file /mosquitto/config/passwd      # mosquitto_passwd -c passwd <device-id>
#   acl_file /mosquitto/config/acl              # see acl.example
#
listener 1883
allow_anonymous true
persistence false
